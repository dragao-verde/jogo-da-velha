<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Jogo da Velha</h1>
    </header>

    <main>
        <div id="info">
            <div>Placar - X: <strong id="placarX">0</strong> | O: <strong id="placarO">0</strong></div>
            <div>Vez do jogador: <strong id="jogadorVez">X</strong></div>
            <div>Tempo: <strong id="tempo">30</strong>s</div>
        </div>

        <div id="tabuleiro">
            <div class="celula" id="celula0" onclick="jogar(0)"></div>
            <div class="celula" id="celula1" onclick="jogar(1)"></div>
            <div class="celula" id="celula2" onclick="jogar(2)"></div>
            <div class="celula" id="celula3" onclick="jogar(3)"></div>
            <div class="celula" id="celula4" onclick="jogar(4)"></div>
            <div class="celula" id="celula5" onclick="jogar(5)"></div>
            <div class="celula" id="celula6" onclick="jogar(6)"></div>
            <div class="celula" id="celula7" onclick="jogar(7)"></div>
            <div class="celula" id="celula8" onclick="jogar(8)"></div>
        </div>

        <div id="botoes">
            <button id="btnPausar" onclick="pausarRetomar()">Pausar</button>
            <button onclick="reiniciarJogo()">Reiniciar Jogo</button>
        </div>
    </main>

    <footer>
        <p><a href="https://github.com/dragao-verde">Link para meu GitHub</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>

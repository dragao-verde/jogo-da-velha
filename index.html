<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Jogo da Velha</h1>
    </header>

    <main>
        <div id="info">
            <div>Placar - <span id="player1Symbol">X</span> <strong id="player1Name">Jogador 1</strong>: <strong id="placar1">0</strong> | <span id="player2Symbol">O</span> <strong id="player2Name">Jogador 2</strong>: <strong id="placar2">0</strong></div>
            <div>Vez do jogador: <strong id="jogadorVez">X</strong></div>
            <div>Tempo: <strong id="tempo">30</strong>s</div>
        </div>

        <div id="tabuleiro">
            <div class="celula" id="celula0" onclick="jogar(0)"></div>
            <div class="celula" id="celula1" onclick="jogar(1)"></div>
            <div class="celula" id="celula2" onclick="jogar(2)"></div>
            <div class="celula" id="celula3" onclick="jogar(3)"></div>
            <div class="celula" id="celula4" onclick="jogar(4)"></div>
            <div class="celula" id="celula5" onclick="jogar(5)"></div>
            <div class="celula" id="celula6" onclick="jogar(6)"></div>
            <div class="celula" id="celula7" onclick="jogar(7)"></div>
            <div class="celula" id="celula8" onclick="jogar(8)"></div>
        </div>

        <div id="botoes">
            <button id="btnPausar" onclick="pausarRetomar()">Pausar</button>
            <button onclick="reiniciarJogo()">Reiniciar Jogo</button>
            <button id="btnSair" onclick="sairJogo()">Sair</button>
        </div>
    </main>

    <!-- Modal de seleção de personagem / apelido -->
    <div id="modalInicio" class="modal">
        <div class="modal-content">
            <h2>Preparar Jogo</h2>
            <div class="player-setup">
                <div class="player-card">
                    <h3>Jogador 1</h3>
                    <input type="text" id="nome1" placeholder="Apelido do Jogador 1" maxlength="12">
                    <div class="opcoes avatars">
                        <label class="avatar">
                            <input type="radio" name="simbolo1" value="x" checked>
                            <img src="./assets/x.svg" alt="X">
                            <div class="label-text">X</div>
                        </label>
                        <label class="avatar">
                            <input type="radio" name="simbolo1" value="capitao">
                            <img src="./assets/capitao-america.png" alt="Capitão América">
                            <div class="label-text">Capitão</div>
                        </label>
                        <label class="avatar">
                            <input type="radio" name="simbolo1" value="aranha">
                            <img src="./assets/homem-aranha.png" alt="Homem-Aranha">
                            <div class="label-text">Aranha</div>
                        </label>
                        <label class="avatar">
                            <input type="radio" name="simbolo1" value="hulk">
                            <img src="./assets/hulk.jpg" alt="Hulk">
                            <div class="label-text">Hulk</div>
                        </label>
                        <label class="avatar">
                            <input type="radio" name="simbolo1" value="lanterna">
                            <img src="./assets/lanterna-verde.webp" alt="Lanterna">
                            <div class="label-text">Lanterna</div>
                        </label>
                        <label class="avatar">
                            <input type="radio" name="simbolo1" value="morcego">
                            <img src="./assets/morcego.jpg" alt="Morcego">
                            <div class="label-text">Morcego</div>
                        </label>
                        <label class="avatar">
                            <input type="radio" name="simbolo1" value="superman">
                            <img src="./assets/superman.jpg" alt="Superman">
                            <div class="label-text">Superman</div>
                        </label>
                    </div>
                </div>
                <div class="player-card">
                    <h3>Jogador 2</h3>
                    <input type="text" id="nome2" placeholder="Apelido do Jogador 2" maxlength="12">
                    <div class="opcoes avatars">
                        <label class="avatar">
                            <input type="radio" name="simbolo2" value="o" checked>
                            <img src="./assets/o.svg" alt="O">
                            <div class="label-text">O</div>
                        </label>
                        <label class="avatar">
                            <input type="radio" name="simbolo2" value="capitao">
                            <img src="./assets/capitao-america.png" alt="Capitão América">
                            <div class="label-text">Capitão</div>
                        </label>
                        <label class="avatar">
                            <input type="radio" name="simbolo2" value="aranha">
                            <img src="./assets/homem-aranha.png" alt="Homem-Aranha">
                            <div class="label-text">Aranha</div>
                        </label>
                        <label class="avatar">
                            <input type="radio" name="simbolo2" value="hulk">
                            <img src="./assets/hulk.jpg" alt="Hulk">
                            <div class="label-text">Hulk</div>
                        </label>
                        <label class="avatar">
                            <input type="radio" name="simbolo2" value="lanterna">
                            <img src="./assets/lanterna-verde.webp" alt="Lanterna Verde">
                            <div class="label-text">Lanterna</div>
                        </label>
                        <label class="avatar">
                            <input type="radio" name="simbolo2" value="morcego">
                            <img src="./assets/morcego.jpg" alt="Morcego">
                            <div class="label-text">Morcego</div>
                        </label>
                        <label class="avatar">
                            <input type="radio" name="simbolo2" value="superman">
                            <img src="./assets/superman.jpg" alt="Superman">
                            <div class="label-text">Superman</div>
                        </label>
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button id="btnComecar">Começar Jogo</button>
            </div>
        </div>
    </div>

    <footer>
        <p><a href="https://github.com/dragao-verde">Link para meu GitHub</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
